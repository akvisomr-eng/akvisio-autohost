name: Sans Rent Cars CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sans_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: WhatsApp outbound policy tests
        run: npm run test:whatsapp-policy
      - name: Finance validation tests
        run: npm run test:finance-validation
      - name: PostgreSQL tenant integrity integration tests
        run: npm run test:tenant-integrity
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sans_test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
